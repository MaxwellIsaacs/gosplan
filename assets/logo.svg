<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gosplan">
  <rect width="512" height="512" rx="56" fill="#c4161c"/>
  <!-- sun-ray wedge, constructivist diagonal -->
  <polygon points="0,512 512,512 512,300" fill="#a50f15"/>
  <g fill="#f3e9d2">
    <!-- wings -->
    <rect x="72" y="184" width="112" height="220"/>
    <rect x="328" y="184" width="112" height="220"/>
    <!-- central block and attic -->
    <rect x="168" y="136" width="176" height="268"/>
    <rect x="200" y="104" width="112" height="40"/>
    <!-- star -->
    <polygon transform="translate(0,-10)" points="256,52 265.4,79.1 294,79.6 271.2,96.9 279.5,124.4 256,108 232.5,124.4 240.8,96.9 218,79.6 246.6,79.1"/>
  </g>
  <g fill="#c4161c">
    <!-- window bays: left wing -->
    <rect x="90" y="208" width="16" height="150"/><rect x="120" y="208" width="16" height="150"/><rect x="150" y="208" width="16" height="150"/>
    <!-- right wing -->
    <rect x="346" y="208" width="16" height="150"/><rect x="376" y="208" width="16" height="150"/><rect x="406" y="208" width="16" height="150"/>
    <!-- centre -->
    <rect x="182" y="164" width="18" height="194"/><rect x="214" y="164" width="18" height="194"/><rect x="247" y="164" width="18" height="194"/><rect x="280" y="164" width="18" height="194"/><rect x="312" y="164" width="18" height="194"/>
    <!-- portal -->
    <rect x="236" y="372" width="40" height="32"/>
  </g>
  <rect x="48" y="404" width="416" height="20" fill="#1a1a1a"/>
</svg>
